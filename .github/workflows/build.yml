name: Build AutoParry JAR

on:
  workflow_dispatch:
  push:
    paths:
      - "autoparry-src-structure.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract source project
        run: |
          rm -rf project
          mkdir project
          unzip -q autoparry-src-structure.zip -d project

          echo "=== Extracted files ==="
          find project -maxdepth 5 -type f | sort

      - name: Find Gradle project
        run: |
          if [ -f project/build.gradle ]; then
            echo "PROJECT_DIR=project" >> "$GITHUB_ENV"
          elif [ -f project/autoparry-src-structure/build.gradle ]; then
            echo "PROJECT_DIR=project/autoparry-src-structure" >> "$GITHUB_ENV"
          else
            echo "Cannot find build.gradle"
            find project -type f | sort
            exit 1
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build JAR
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew 2>/dev/null || true

          if [ -f gradlew ]; then
            ./gradlew build
          else
            gradle build
          fi

      - name: List build output
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== JAR files ==="
          find build/libs -type f -name "*.jar" -print

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: autoparry-jar
          path: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
